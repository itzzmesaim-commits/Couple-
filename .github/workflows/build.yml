name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project and add Firebase keys
        run: |
          unzip -q Couples-project.zip
          cat > couples/www/js/firebase-config.js <<'EOF'
          const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBMx0DuAF3hJWK0TLFK99--klC2NFuEGnQ",
            authDomain: "couples-ab32f.firebaseapp.com",
            projectId: "couples-ab32f",
            storageBucket: "couples-ab32f.firebasestorage.app",
            messagingSenderId: "991388748844",
            appId: "1:991388748844:web:e8402176421660c9be9589"
          };
          EOF
      - name: Install
        working-directory: couples
        run: npm install
      - name: Android platform
        working-directory: couples
        run: npx cap add android
      - name: Icons
        working-directory: couples
        run: npx @capacitor/assets generate --android
      - name: Sync
        working-directory: couples
        run: npx cap sync android
      - name: Build APK
        working-directory: couples/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Couples-APK
          path: couples/android/app/build/outputs/apk/debug/app-debug.apk
